cache:
  key:
    files:
      - Gemfile.lock
  paths:
    - vendor/bundle

before_script:
  - phantomjs -v
  - ruby -v
  - gem -v
  - gem install bundler --no-document
  - bundle -v
  - bundle check || bundle install -j $(nproc) --path vendor/bundle
  - RAILS_ENV=test bundle exec rake extension:test_app

Test Solidus 3.0:
  image: "circleci/ruby:3.0-node-browsers-legacy"
  variables:
    SOLIDUS_VERSION: v3.0
  script: bundle exec rspec --format progress --format RspecJunitFormatter --out rspec.xml
  coverage: '/\((\d+\.\d+)%\) covered./'
  artifacts:
    when: always
    paths:
      - rspec.xml
      - spec/dummy/tmp/capybara
    reports:
      junit: rspec.xml

