image: "circleci/ruby:2.6-node-browsers-legacy"

cache:
  key:
    files:
      - Gemfile.lock
  paths:
    - vendor/bundle

before_script:
  - phantomjs -v
  - ruby -v
  - gem -v
  - gem install bundler:1.17.3 --no-document
  - bundle -v
  - bundle check || bundle install -j $(nproc) --path vendor/bundle
  - RAILS_ENV=test bundle exec rake test_app

rspec:
  script: bundle exec rspec --format progress --format RspecJunitFormatter --out rspec.xml
  coverage: '/\((\d+\.\d+)%\) covered./'
  artifacts:
    when: always
    paths:
      - rspec.xml
      - spec/dummy/tmp/capybara
    reports:
      junit: rspec.xml
