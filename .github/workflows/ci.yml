name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  RSpec:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby_version:
          - "3.0"
          - "3.1"
          - "3.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby_version }}
          bundler-cache: true
      - name: Setup test db
        run: |
          cd spec/dummy
          RAILS_ENV=test bin/rake db:test:prepare
          cd -
      - name: Run tests
        run: bin/rspec
      - uses: actions/upload-artifact@main
        if: failure()
        with:
          name: Screenshots
          path: spec/dummy/tmp/capybara
