name: Post Release

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Target branch (e.g., main, 8.0-stable)'
        required: true
        default: 'main'
        type: string
  repository_dispatch:
    types: [post-release]

jobs:
  post-release:
    uses: blish/ops/.github/workflows/post-release.yml@main
    with:
      version_file_path: lib/solidus_bookkeeping_documents/version.rb
      target_branch: ${{ github.event.client_payload.target_branch || inputs.target_branch }}
    secrets:
      app_id: ${{ vars.BLISH_BOT_APP_ID }}
      app_private_key: ${{ secrets.BLISH_BOT_APP_PRIVATE_KEY }}
      slack_webhook_url: ${{ secrets.SLACK_RELEASES_WEBHOOK_URL }}
