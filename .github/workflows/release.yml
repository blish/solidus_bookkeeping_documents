name: Publish Release

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - main
      - '*-stable'

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/v'))
    uses: blish/ops/.github/workflows/release.yml@test-app-token-push
    with:
      version_file_path: lib/solidus_bookkeeping_documents/version.rb
      target_branch: ${{ github.event.pull_request.base.ref || github.ref_name }}
    secrets:
      app_id: ${{ vars.BLISH_BOT_APP_ID }}
      app_private_key: ${{ secrets.BLISH_BOT_APP_PRIVATE_KEY }}
      gem_push_token: ${{ secrets.BLISH_BOT_PACKAGES_TOKEN }}
