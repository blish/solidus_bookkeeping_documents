changelog:
  exclude:
    labels:
      - wontfix
      - invalid
      - documentation
  categories:
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Fixes
      labels:
        - bug
    - title: Breaking Changes
      labels:
        - breaking-change
    - title: Other Changes
      labels:
        - "*"
      exclude:
        labels:
          - dependencies
    - title: Dependencies
      labels:
        - dependencies
